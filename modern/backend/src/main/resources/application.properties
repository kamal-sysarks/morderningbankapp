spring.application.name=modern-banking-backend
server.port=8080

# SQLite datasource
spring.datasource.url=jdbc:sqlite:${DB_PATH:../../../legacybank.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# Spring Data JDBC - no schema auto-creation (schema managed by init.sh)
spring.sql.init.mode=never

# JWT
app.jwt.secret=${JWT_SECRET:modernbankingsecret2024xyzabcdefghijklmnopq}
app.jwt.expiration-hours=8

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS allowed origins (Vite dev + production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.modernbank=INFO
logging.level.org.springframework.security=WARN
