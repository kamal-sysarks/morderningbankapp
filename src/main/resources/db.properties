# Database configuration for the Legacy Banking application (SQLite).
# SQLite is an embedded database: there is no server to install or start.
# The database file is created and loaded with seed data automatically on first start.
#
# Values can be overridden with JVM system properties, e.g.
#   java -Ddb.url=jdbc:sqlite:/tmp/demo.db -jar target/legacy-banking-app.jar
# or with a file path:  -Ddb.config=/path/to/my-db.properties

db.driver=org.sqlite.JDBC
# Relative paths are resolved against the directory the application is started from.
db.url=jdbc:sqlite:legacybank.db
# Not used by SQLite (kept so the configuration shape stays the same as for a server database).
db.username=
db.password=
